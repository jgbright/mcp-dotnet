# Cuts a release: build, test, pack, tag, publish a GitHub Release with the .nupkg files attached,
# and push both packages to nuget.org.
#
# Dispatched by hand rather than triggered by a pushed tag: the version comes from version.json
# plus git height, so this workflow is what knows it, and a hand-typed tag could disagree.
name: release

on:
  workflow_dispatch:

# contents: write authorizes the tag push and the release. id-token: write lets the job mint the
# GitHub OIDC token that nuget.org's trusted publishing exchanges for a temporary push key;
# without it the login step fails with "no token available". No packages: write — that governs
# GitHub Packages, which is not where these go.
permissions:
  contents: write
  id-token: write

# Never two releases at once, and never cancel one midway: a cancelled run can leave a pushed tag
# with no release attached.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out (full history and tags)
        uses: actions/checkout@v7
        with:
          # nbgv derives the patch from git height, and this job checks the tag it is about to
          # create against the ones already there. A shallow clone has neither.
          fetch-depth: 0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore local tools (nbgv)
        run: dotnet tool restore

      # The gate runs before the build: failing in ten seconds beats failing after a build, a
      # test run and a pack.
      - name: Check this ref can be released
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          if ($env:GITHUB_REF -ne 'refs/heads/main') {
            throw "Releases are cut from main. This run is on '$env:GITHUB_REF'."
          }

          $raw = dotnet nbgv get-version --format json
          if ($LASTEXITCODE -ne 0) { throw 'nbgv could not compute a version.' }
          $v = $raw | ConvertFrom-Json

          # PublicRelease is nbgv matching the ref against publicReleaseRefSpec in version.json.
          # If it is false the packages carry a -g<commit> suffix, which cannot ship as a release.
          if (-not $v.PublicRelease) {
            throw "nbgv says this is not a public release: version '$($v.NuGetPackageVersion)' " +
                  "from ref '$($v.BuildingRef)'. version.json's publicReleaseRefSpec decides this."
          }
          if ($v.NuGetPackageVersion -match '-') {
            throw "Version '$($v.NuGetPackageVersion)' is a prerelease."
          }

          $tag = "v$($v.SimpleVersion)"
          if (git tag --list $tag) {
            throw "Tag $tag already exists. Bump the major/minor in version.json, or check whether " +
                  'this commit has already been released.'
          }

          "version=$($v.SimpleVersion)" | Out-File $env:GITHUB_OUTPUT -Append
          "tag=$tag" | Out-File $env:GITHUB_OUTPUT -Append
          Write-Host "releasing $($v.SimpleVersion) as $tag"

      - name: Restore
        run: dotnet restore McpServers.slnx

      - name: Build
        run: dotnet build McpServers.slnx --configuration Release --no-restore -warnaserror

      # No LogFileName, for the reason pr.yml gives: two test projects, one results directory.
      - name: Test
        run: >
          dotnet test McpServers.slnx --configuration Release --no-build
          --logger "trx"
          --results-directory artifacts/test-results

      # No --no-build: PackAsTool runs a publish as part of packing, and suppressing the build takes
      # that with it, producing a package whose tool payload is stale or missing. Both servers pack
      # (teams-mcp, ado-mcp) into artifacts/, per PackageOutputPath in Directory.Build.props.
      - name: Pack
        run: dotnet pack McpServers.slnx --configuration Release

      - name: Tag
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # nbgv writes an annotated tag, which needs a committer identity the runner does not have.
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          dotnet nbgv tag
          if ($LASTEXITCODE -ne 0) { throw 'nbgv tag failed.' }

          git push origin "refs/tags/${{ steps.version.outputs.tag }}"
          if ($LASTEXITCODE -ne 0) { throw 'Pushing the tag failed.' }

      - name: Create the GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          # PowerShell does not expand a glob for a native command, so the paths are resolved here.
          # Passing the array expands to one argument per file.
          $packages = @(Get-ChildItem artifacts/*.nupkg | ForEach-Object { $_.FullName })
          if (-not $packages) { throw 'No .nupkg files in artifacts/ to attach.' }
          $packages | ForEach-Object { Write-Host "attaching $_" }

          gh release create "${{ steps.version.outputs.tag }}" $packages `
            --title "${{ steps.version.outputs.tag }}" `
            --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'gh release create failed.' }

      - name: Upload the packages as build artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/*.nupkg
          if-no-files-found: warn

      # No long-lived API key: nuget.org trusted publishing exchanges this job's GitHub OIDC token
      # for a temporary push key, against a policy that names this repository owner, repository
      # and workflow file (`release.yml`, no path). Renaming this file breaks publishing until the
      # policy is edited to match.
      #
      # Immediately before the push on purpose: the key lives one hour and each OIDC token buys
      # exactly one key.
      #
      # NUGET_USER is the nuget.org profile name, not a credential; it is a secret only because
      # nuget.org recommends it. The OIDC token and policy are what authorize the push.
      - name: Get a short-lived NuGet key (trusted publishing)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      # Last, and the only irreversible step: a published version can never be re-pushed or
      # deleted, only unlisted. Everything that fails cheaply has already run, so a failure here
      # leaves a release with no feed entry rather than a feed entry with no release behind it.
      # --skip-duplicate makes a re-dispatch after a half-finished push a no-op instead of a 409.
      - name: Push to NuGet
        shell: pwsh
        env:
          NUGET_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($p in Get-ChildItem artifacts/*.nupkg) {
            dotnet nuget push $p.FullName `
              --source https://api.nuget.org/v3/index.json `
              --api-key $env:NUGET_KEY `
              --skip-duplicate
            if ($LASTEXITCODE -ne 0) { throw "Pushing $($p.Name) failed." }
          }
